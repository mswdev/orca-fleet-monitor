<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fleet Monitor 1.2 preview</title>
    <style>
      body { margin: 0; padding: 24px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #e9e9ec; color: #1a1b1f; }
      body.dark { background: #0b0b0d; color: #ececf1; }
      h1 { margin: 0 0 4px; font-size: 16px; }
      p { margin: 0 0 16px; color: #5f6370; }
      section { margin-bottom: 28px; }
      h2 { margin: 0 0 8px; font-size: 13px; }
      .row { display: flex; gap: 16px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 4px; font-size: 11px; color: #8a8d97; }
      iframe { display: block; border: 1px solid #c9cad1; border-radius: 6px; background: transparent; }
      body.dark iframe { border-color: #2f3038; }
    </style>
  </head>
  <body>
    <h1>Fleet Monitor 1.2 preview</h1>
    <p>The real panel fed with invented sample data (tools/preview/activity-sample.mjs), in each 1.2 state. <a href="?theme=light">Light</a> · <a href="?theme=dark">Dark</a></p>
    <main id="states"></main>
    <script type="module">
      import { STATES } from './activity-states.mjs'
      const theme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light'
      document.body.classList.toggle('dark', theme === 'dark')
      const main = document.getElementById('states')
      for (const name of Object.keys(STATES)) {
        const section = document.createElement('section')
        section.append(Object.assign(document.createElement('h2'), { textContent: name }))
        const row = document.createElement('div')
        row.className = 'row'
        for (const width of [220, 360, 700]) {
          const figure = document.createElement('figure')
          figure.append(Object.assign(document.createElement('figcaption'), { textContent: `${width} px` }))
          const frame = document.createElement('iframe')
          frame.width = String(width)
          frame.height = '900'
          frame.title = `${name}, ${width} px`
          frame.src = `activity-frame.html?state=${name}&theme=${theme}`
          figure.append(frame)
          row.append(figure)
        }
        section.append(row)
        main.append(section)
      }
    </script>
  </body>
</html>
