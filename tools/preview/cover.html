<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1600" />
    <title>Fleet Monitor cover</title>
    <!-- The 1600×1000 cover for the plugin page: the icon, the name, what it does, and two real
         panels (overview and a detail) in the dark theme, fed with the invented sample fleet. -->
    <style>
      html, body { margin: 0; }
      body {
        width: 1600px;
        height: 1000px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 640px 1fr;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: #ececf1;
        background:
          radial-gradient(900px 600px at 78% 40%, rgb(122 162 255 / 0.16), transparent 70%),
          radial-gradient(700px 500px at 10% 90%, rgb(74 222 128 / 0.07), transparent 70%),
          #0b0b0d;
      }
      .copy { padding: 0 40px 0 104px; }
      .icon { display: block; width: 128px; height: 128px; margin-bottom: 36px; border: 0; }
      h1 { margin: 0 0 18px; font-size: 64px; font-weight: 680; letter-spacing: -0.02em; }
      .lede { margin: 0 0 34px; font-size: 26px; line-height: 1.4; color: #c2c5ce; }
      ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }
      li { display: flex; align-items: center; gap: 14px; font-size: 20px; color: #a0a3ad; }
      .pips { display: inline-flex; align-items: flex-end; gap: 3px; height: 18px; flex: none; }
      .pips span { width: 5px; border-radius: 1.5px; background: currentColor; }
      .pips span:nth-child(1) { height: 7px; }
      .pips span:nth-child(2) { height: 11px; }
      .pips span:nth-child(3) { height: 15px; }
      .pips span:nth-child(4) { height: 18px; }
      .panels { display: flex; gap: 32px; align-items: flex-start; height: 1000px; padding-top: 70px; box-sizing: border-box; }
      iframe { display: block; width: 400px; height: 860px; border: 0; border-radius: 14px; box-shadow: 0 18px 60px rgb(0 0 0 / 0.65), 0 0 0 1px #2f3038; }
    </style>
  </head>
  <body>
    <div class="copy">
      <img class="icon" src="../../media/icon.png" alt="" />
      <h1>Fleet Monitor</h1>
      <p class="lede">Every machine your Orca reaches, live, in one sidebar panel.</p>
      <ul>
        <li><span class="pips" style="color: #4ade80"><span></span><span></span><span></span><span></span></span>CPU, memory and per-core load, with 30 minutes of history</li>
        <li><span class="pips" style="color: #facc15"><span></span><span></span><span></span><span></span></span>The busiest workspaces on each machine</li>
        <li><span class="pips" style="color: #fb923c"><span></span><span></span><span></span><span></span></span>Over Orca’s own pairing, with no SSH</li>
      </ul>
    </div>
    <div class="panels">
      <iframe src="frame.html?state=live&theme=dark" title="Overview"></iframe>
      <iframe src="frame.html?state=live&machine=studio&theme=dark" title="Machine detail"></iframe>
    </div>
  </body>
</html>
