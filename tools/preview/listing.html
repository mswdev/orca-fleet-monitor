<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280" />
    <title>Fleet Monitor listing screenshot</title>
    <style>
      html, body { margin: 0; }
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 400px 1fr;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #e9e9ec;
        color: #1a1b1f;
      }
      body.dark { background: #0b0b0d; color: #ececf1; }
      .copy { padding: 0 40px 0 72px; }
      h1 { margin: 0 0 12px; font-size: 34px; font-weight: 650; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 17px; line-height: 1.5; color: #5f6370; }
      body.dark p { color: #a0a3ad; }
      .panels { display: flex; gap: 24px; align-items: flex-start; height: 800px; padding-top: 48px; box-sizing: border-box; }
      iframe { display: block; width: 360px; height: 704px; border: 0; border-radius: 12px; box-shadow: 0 10px 40px rgb(0 0 0 / 0.16); }
      body.dark iframe { box-shadow: 0 10px 40px rgb(0 0 0 / 0.6), 0 0 0 1px #2f3038; }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1>Fleet Monitor</h1>
      <p>Live CPU, memory and the busiest workspaces for this computer and every paired Orca server, in one sidebar panel.</p>
    </div>
    <div class="panels">
      <iframe id="a" title="Overview"></iframe>
      <iframe id="b" title="Machine detail"></iframe>
    </div>
    <script type="module">
      const theme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light'
      document.body.classList.toggle('dark', theme === 'dark')
      document.getElementById('a').src = `frame.html?state=live&theme=${theme}`
      document.getElementById('b').src = `frame.html?state=live&machine=studio&theme=${theme}`
    </script>
  </body>
</html>
