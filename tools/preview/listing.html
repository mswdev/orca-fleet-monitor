<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280" />
    <title>Fleet Monitor listing screenshot</title>
    <!-- A 1280×800 listing screenshot: a short caption beside two real panels fed with the invented
         sample fleet. ?theme=light|dark  ?scene=fleet (overview and a detail) | basic (a basic
         machine with its install row open, and an offline one). -->
    <style>
      html, body { margin: 0; }
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 420px 1fr;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #e9e9ec;
        color: #1a1b1f;
      }
      body.dark { background: #0b0b0d; color: #ececf1; }
      .copy { padding: 0 36px 0 72px; }
      h1 { margin: 0 0 14px; font-size: 34px; font-weight: 650; letter-spacing: -0.01em; }
      p { margin: 0 0 14px; font-size: 17px; line-height: 1.5; color: #4d515c; }
      body.dark p { color: #a0a3ad; }
      .panels { display: flex; gap: 24px; align-items: flex-start; height: 800px; padding-top: 48px; box-sizing: border-box; }
      iframe { display: block; width: 360px; height: 704px; border: 0; border-radius: 12px; box-shadow: 0 10px 40px rgb(0 0 0 / 0.16); }
      body.dark iframe { box-shadow: 0 10px 40px rgb(0 0 0 / 0.6), 0 0 0 1px #2f3038; }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1 id="title"></h1>
      <p id="line1"></p>
      <p id="line2"></p>
    </div>
    <div class="panels">
      <iframe id="a" title="First panel"></iframe>
      <iframe id="b" title="Second panel"></iframe>
    </div>
    <script type="module">
      const params = new URLSearchParams(location.search)
      const theme = params.get('theme') === 'dark' ? 'dark' : 'light'
      const scene = params.get('scene') === 'basic' ? 'basic' : 'fleet'
      document.body.classList.toggle('dark', theme === 'dark')
      const text = {
        fleet: [
          'Fleet Monitor',
          'Live CPU, memory and the busiest workspaces for this computer and every paired Orca server, in one sidebar panel.',
          'Each machine’s detail has 30-minute charts, per-core load with P-cores and E-cores, and why its health is what it is.'
        ],
        basic: [
          'Nothing to install first',
          'Any paired Orca server shows up at once, read through Orca itself: memory, load and the busiest workspaces.',
          'Install Fleet Monitor there too for measured CPU, per-core load and, on a Mac, real RAM usage, swap and memory pressure. The panel gives you the command.'
        ]
      }[scene]
      document.getElementById('title').textContent = text[0]
      document.getElementById('line1').textContent = text[1]
      document.getElementById('line2').textContent = text[2]
      const frames =
        scene === 'basic'
          ? [`frame.html?state=live&machine=ci&install=open&theme=${theme}`, `frame.html?state=live&machine=air&theme=${theme}`]
          : [`frame.html?state=live&theme=${theme}`, `frame.html?state=live&machine=studio&theme=${theme}`]
      document.getElementById('a').src = frames[0]
      document.getElementById('b').src = frames[1]
    </script>
  </body>
</html>
